<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture Quiz Generator</title>
    <link rel="icon" href="{{ url_for('static', filename='presentation (1).png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
        <i class="fas fa-moon"></i>
    </button>

    <div class="container">
        <h1>Lecture Quiz Generator</h1>
        <div class="quiz-form" id="quiz-form">
            <input type="text" id="video-url" placeholder="Enter YouTube video URL" aria-label="YouTube video URL">
            <input type="number" id="num-questions" min="1" max="10" value="5" placeholder="Number of questions" aria-label="Number of questions">
            <button id="generate-quiz">
                <i class="fas fa-magic"></i> Generate Quiz
            </button>
        </div>

        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p id="loading-text">Generating your quiz...</p>
        </div>

        <div id="transcription-container" class="hidden">
            <h2>Video Transcription</h2>
            <button id="toggle-transcription">
                <i class="fas fa-book-open"></i> Show/Hide Transcription
            </button>
            <div id="transcription-content" class="hidden">
                <p id="transcription-text"></p>
            </div>
        </div>

        <div id="quiz-container" class="hidden">
            <h2>Take the Quiz</h2>
            <div class="progress-bar">
                <div class="progress-fill" style="width: 0%"></div>
            </div>
            <div id="questions"></div>
            <button id="submit-quiz">
                <i class="fas fa-check-circle"></i> Submit Quiz
            </button>
        </div>

        <div id="results-container" class="hidden">
            <h2>Quiz Results</h2>
            <div class="score-display">
                <i class="fas fa-star"></i> <span id="score"></span>
            </div>
            <div id="question-results"></div>
            <div class="social-share">
                <button onclick="shareOnTwitter()">
                    <i class="fab fa-twitter"></i> Share Score
                </button>
                <button onclick="shareOnFacebook()">
                    <i class="fab fa-facebook"></i> Share Score
                </button>
                <button onclick="startNewQuiz()">
                    <i class="fas fa-redo"></i> Try Another Quiz
                </button>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
